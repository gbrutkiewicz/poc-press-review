<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doc Scanner — Revue</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>Doc Scanner <span>· revue de presse</span></h1>
    <div id="stats" class="muted"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <a id="tab-pending" role="tab" href="#/a-valider" aria-selected="false">À valider <span class="count" id="count-pending">–</span></a>
    <a id="tab-validated" role="tab" href="#/valides" aria-selected="false">Validés <span class="count" id="count-validated">–</span></a>
    <a id="tab-errors" role="tab" href="#/erreurs" aria-selected="false" hidden>Erreurs <span class="count" id="count-errors">–</span></a>
  </nav>

  <section class="toolbar">
    <form id="scan-form">
      <input id="scan-path" type="text" placeholder="./data/input/sample-fashion.pdf (ou nom de fichier)" autocomplete="off" aria-label="Fichier à scanner">
      <button type="submit">Scanner ce fichier</button>
    </form>
    <button id="scan-input" class="secondary">Scanner tout <code id="input-dir">data/input</code></button>
    <a href="/api/export?format=csv" class="secondary button">Export CSV</a>
    <a href="/api/export" class="secondary button" target="_blank" rel="noopener">Export JSON</a>
  </section>
  <div id="flash" role="status" hidden></div>

  <main id="view"><p class="muted">Chargement…</p></main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
